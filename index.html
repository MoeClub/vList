<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>vList</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f9;
      --surface: rgba(255, 255, 255, .88);
      --surface-solid: #fff;
      --text: #172033;
      --muted: #718096;
      --line: #e7ebf1;
      --accent: #476dff;
      --accent-soft: #edf1ff;
      --shadow: 0 18px 48px rgba(27, 39, 75, .08);
      --radius: 18px;
    }

    html[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0e1320;
      --surface: rgba(22, 29, 45, .88);
      --surface-solid: #161d2d;
      --text: #ecf1fb;
      --muted: #98a5bb;
      --line: #283248;
      --accent: #7793ff;
      --accent-soft: #222e52;
      --shadow: 0 20px 56px rgba(0, 0, 0, .28);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 8% 0%, rgba(71, 109, 255, .13), transparent 30rem),
        radial-gradient(circle at 96% 18%, rgba(71, 197, 255, .09), transparent 25rem),
        var(--bg);
      font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }

    .shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0 48px;
    }

    .action-button, .close-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      color: var(--text);
      background: var(--surface-solid);
      cursor: pointer;
      transition: border-color .18s, background .18s, transform .18s, color .18s;
    }

    .action-button:hover, .close-button:hover {
      color: var(--accent);
      border-color: color-mix(in srgb, var(--accent) 42%, var(--line));
      transform: translateY(-1px);
    }

    .panel {
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--line) 82%, transparent);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 76px;
      padding: 15px 18px;
      border-bottom: 1px solid var(--line);
    }

    .breadcrumbs {
      display: flex;
      flex: 1 1 auto;
      align-items: center;
      min-width: 0;
      overflow-x: auto;
      scrollbar-width: none;
      white-space: nowrap;
    }

    .breadcrumbs::-webkit-scrollbar { display: none; }

    .crumb {
      display: inline-flex;
      align-items: center;
      min-height: 36px;
      padding: 0 8px;
      color: var(--muted);
      border-radius: 9px;
      text-decoration: none;
      font-weight: 560;
    }

    .crumb:hover { color: var(--accent); background: var(--accent-soft); }
    .crumb.current { color: var(--text); pointer-events: none; }
    .crumb-separator { color: var(--muted); opacity: .55; }
    .home-link + .crumb-separator { margin-left: 8px; }

    .home-link {
      display: grid;
      flex: 0 0 38px;
      width: 38px;
      height: 38px;
      padding: 0;
      place-items: center;
      color: color-mix(in srgb, var(--accent) 78%, var(--muted));
      border: 1px solid color-mix(in srgb, var(--accent) 16%, var(--line));
      border-radius: 8px;
      background: color-mix(in srgb, var(--accent-soft) 72%, var(--surface-solid));
      box-shadow: 0 3px 10px color-mix(in srgb, var(--accent) 9%, transparent);
    }

    .home-link svg { width: 21px; height: 21px; stroke-width: 1.9; }

    .home-link:hover {
      color: var(--accent);
      border-color: color-mix(in srgb, var(--accent) 28%, var(--line));
      background: var(--accent-soft);
    }

    .search-wrap {
      position: relative;
      flex: 0 1 310px;
      min-width: 190px;
    }

    .search-wrap svg {
      position: absolute;
      left: 13px;
      top: 50%;
      width: 17px;
      height: 17px;
      color: var(--muted);
      transform: translateY(-50%);
      pointer-events: none;
    }

    .search {
      width: 100%;
      height: 42px;
      padding: 0 38px 0 39px;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 12px;
      outline: 0;
      background: var(--bg);
      transition: box-shadow .18s, border-color .18s, background .18s;
    }

    .search:focus {
      border-color: var(--accent);
      background: var(--surface-solid);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 13%, transparent);
    }

    .search-clear {
      position: absolute;
      right: 8px;
      top: 50%;
      display: none;
      width: 28px;
      height: 28px;
      padding: 0;
      border: 0;
      border-radius: 8px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      transform: translateY(-50%);
    }

    .search-clear.visible { display: grid; place-items: center; }
    .search-clear:hover { color: var(--text); background: var(--line); }

    .table-head, .file-row {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) 170px 105px 90px;
      align-items: center;
      gap: 16px;
      padding: 0 20px;
    }

    .table-head {
      min-height: 44px;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
      font-size: 12px;
      font-weight: 650;
      letter-spacing: .05em;
      text-transform: uppercase;
    }

    .sort-button {
      width: fit-content;
      padding: 0;
      color: inherit;
      border: 0;
      background: transparent;
      font: inherit;
      letter-spacing: inherit;
      text-transform: inherit;
      cursor: pointer;
    }

    .sort-button:hover, .sort-button.active { color: var(--accent); }

    .file-row {
      min-height: 68px;
      border-bottom: 1px solid var(--line);
      transition: background .16s;
    }

    .file-row:last-child { border-bottom: 0; }
    .file-row:hover { background: color-mix(in srgb, var(--accent-soft) 55%, transparent); }

    .file-name-cell {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 13px;
    }

    .file-icon {
      display: grid;
      flex: 0 0 38px;
      place-items: center;
      width: 38px;
      height: 38px;
      color: #71809c;
      border-radius: 11px;
      background: #eef1f6;
    }

    html[data-theme="dark"] .file-icon { background: #252e42; }
    .file-icon.folder { color: #d49125; background: #fff3d7; }
    .file-icon.image { color: #9b5de5; background: #f2e9ff; }
    .file-icon.video { color: #e45b73; background: #ffe9ed; }
    .file-icon.audio { color: #1677b8; background: #e5f3ff; }
    .file-icon.pdf { color: #c63d4f; background: #ffe9ec; }
    .file-icon.text { color: #25866d; background: #e5f7f1; }
    html[data-theme="dark"] .file-icon.folder { background: #3d3220; }
    html[data-theme="dark"] .file-icon.image { background: #342744; }
    html[data-theme="dark"] .file-icon.video { background: #422831; }
    html[data-theme="dark"] .file-icon.audio { background: #20364a; }
    html[data-theme="dark"] .file-icon.pdf { background: #42272e; }
    html[data-theme="dark"] .file-icon.text { background: #203c37; }

    .file-link {
      overflow: hidden;
      color: var(--text);
      text-overflow: ellipsis;
      white-space: nowrap;
      text-decoration: none;
      font-weight: 580;
      cursor: pointer;
    }

    .file-link:hover { color: var(--accent); }
    .meta { overflow: hidden; color: var(--muted); text-overflow: ellipsis; white-space: nowrap; }

    .actions { display: flex; justify-content: flex-end; gap: 7px; }

    .action-button {
      min-width: 36px;
      height: 34px;
      padding: 0 10px;
      border-radius: 10px;
      text-decoration: none;
    }

    .empty {
      display: none;
      min-height: 320px;
      padding: 64px 24px;
      place-items: center;
      text-align: center;
      color: var(--muted);
    }

    .empty.visible { display: grid; }
    .empty svg { width: 58px; height: 58px; margin-bottom: 15px; opacity: .5; }
    .empty h2 { margin: 0 0 5px; color: var(--text); font-size: 18px; }
    .empty p { margin: 0; }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(7, 11, 20, .78);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .modal.open { display: flex; animation: fade-in .18s ease-out; }

    .modal-card {
      display: flex;
      flex-direction: column;
      width: min(1080px, 100%);
      max-height: calc(100vh - 48px);
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 18px;
      background: #111722;
      box-shadow: 0 28px 90px rgba(0, 0, 0, .45);
      animation: rise .22s ease-out;
    }

    .modal-head {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 62px;
      padding: 10px 12px 10px 19px;
      color: #f5f7fb;
      border-bottom: 1px solid rgba(255, 255, 255, .1);
    }

    .modal-title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 620;
    }

    .modal-download, .close-button {
      height: 38px;
      color: #f5f7fb;
      border-color: rgba(255, 255, 255, .14);
      background: rgba(255, 255, 255, .08);
      border-radius: 10px;
    }

    .modal-download { width: 38px; padding: 0; text-decoration: none; }
    .close-button { width: 38px; padding: 0; }

    .preview-stage {
      position: relative;
      display: grid;
      min-height: min(68vh, 700px);
      place-items: center;
      overflow: auto;
      background:
        linear-gradient(45deg, #151b27 25%, transparent 25%) 0 0 / 24px 24px,
        linear-gradient(-45deg, #151b27 25%, transparent 25%) 0 12px / 24px 24px,
        linear-gradient(45deg, transparent 75%, #151b27 75%) 12px -12px / 24px 24px,
        linear-gradient(-45deg, transparent 75%, #151b27 75%) -12px 0 / 24px 24px,
        #111722;
    }

    .preview-stage img {
      display: block;
      max-width: 100%;
      max-height: calc(100vh - 150px);
      object-fit: contain;
    }

    .preview-stage video {
      width: 100%;
      max-height: calc(100vh - 150px);
      background: #000;
    }

    .preview-stage.audio-mode {
      min-height: 260px;
      padding: 32px;
      background: radial-gradient(circle at 50% 10%, #25304a, #111722 65%);
    }

    .audio-preview {
      width: min(680px, 100%);
    }

    .preview-stage.pdf-mode {
      display: block;
      height: calc(100vh - 150px);
      min-height: 420px;
      background: #e9edf3;
    }

    .pdf-preview {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: white;
    }

    .preview-stage.text-mode {
      display: block;
      background: #0d1117;
    }

    .text-preview {
      min-width: 100%;
      min-height: min(68vh, 700px);
      margin: 0;
      padding: 24px;
      color: #d6deeb;
      background: #0d1117;
      font: 13px/1.68 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      tab-size: 4;
      white-space: pre;
    }

    .preview-message { padding: 32px; color: #b9c2d2; text-align: center; }

    @keyframes fade-in { from { opacity: 0; } }
    @keyframes rise { from { opacity: 0; transform: translateY(12px) scale(.99); } }

    @media (max-width: 760px) {
      .shell { width: min(100% - 20px, 1180px); padding: 26px 0 30px; }
      .toolbar { align-items: stretch; flex-direction: column; gap: 10px; padding: 13px; }
      .search-wrap { flex-basis: auto; width: 100%; }
      .table-head { display: none; }
      .file-row { grid-template-columns: minmax(0, 1fr) auto; gap: 10px; min-height: 72px; padding: 0 13px; }
      .file-row .date, .file-row .size { display: none; }
      .actions { grid-column: 2; }
      .action-button { width: 36px; padding: 0; }
      .modal { padding: 0; }
      .modal-card { width: 100%; max-height: 100vh; min-height: 100vh; border: 0; border-radius: 0; }
      .preview-stage { min-height: calc(100vh - 62px); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main id="app" class="shell" data-root="{{.RootPath}}" data-current="{{.CurrentPath}}" data-files="{{.RawData}}">
    <section class="panel" aria-label="文件列表">
      <div class="toolbar">
        <nav id="breadcrumbs" class="breadcrumbs" aria-label="路径导航"></nav>
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>
          </svg>
          <input id="searchInput" class="search" type="search" autocomplete="off" placeholder="搜索当前目录…" aria-label="搜索当前目录">
          <button id="searchClear" class="search-clear" type="button" aria-label="清空搜索">×</button>
        </div>
      </div>

      <div class="table-head" aria-hidden="true">
        <button class="sort-button active" data-sort="name" type="button">名称</button>
        <button class="sort-button" data-sort="date" type="button">修改时间</button>
        <button class="sort-button" data-sort="size" type="button">大小</button>
        <span style="text-align:right">操作</span>
      </div>
      <div id="fileList"></div>
      <div id="emptyState" class="empty">
        <div>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
            <path d="M3.5 7.5h6l2-2h9A1.5 1.5 0 0 1 22 7v10.5a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 1.5-2Z"/><path d="m9 11 6 6m0-6-6 6"/>
          </svg>
          <h2 id="emptyTitle">当前目录为空</h2>
          <p id="emptyText">这里暂时没有可显示的文件</p>
        </div>
      </div>
    </section>
  </main>

  <div id="previewModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="previewTitle">
    <div class="modal-card">
      <div class="modal-head">
        <div id="previewTitle" class="modal-title"></div>
        <a id="modalDownload" class="action-button modal-download" href="#" aria-label="下载" title="下载">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M12 3v12m-5-5 5 5 5-5M5 21h14"/>
          </svg>
        </a>
        <button id="modalClose" class="close-button" type="button" aria-label="关闭预览">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div id="previewStage" class="preview-stage"></div>
    </div>
  </div>

  <script>
    (() => {
      'use strict';

      const app = document.getElementById('app');
      const breadcrumbs = document.getElementById('breadcrumbs');
      const listElement = document.getElementById('fileList');
      const searchInput = document.getElementById('searchInput');
      const searchClear = document.getElementById('searchClear');
      const emptyState = document.getElementById('emptyState');
      const emptyTitle = document.getElementById('emptyTitle');
      const emptyText = document.getElementById('emptyText');
      const modal = document.getElementById('previewModal');
      const previewStage = document.getElementById('previewStage');
      const previewTitle = document.getElementById('previewTitle');
      const modalDownload = document.getElementById('modalDownload');
      const modalClose = document.getElementById('modalClose');
      const sortButtons = [...document.querySelectorAll('[data-sort]')];
      const rootPath = normalizePath(app.dataset.root || '/');
      const currentPath = normalizePath(app.dataset.current || '/');
      const imageTypes = new Set(['jpg', 'jpeg', 'png', 'gif', 'webp', 'avif', 'svg', 'bmp', 'ico']);
      const videoTypes = new Set(['mp4', 'webm', 'ogv', 'mov', 'm4v', 'mkv']);
      const audioTypes = new Set(['mp3', 'wav', 'm4a', 'aac', 'flac', 'ogg', 'oga', 'opus', 'weba']);
      const textTypes = new Set([
        'txt', 'md', 'markdown', 'log', 'csv', 'tsv', 'json', 'jsonl', 'xml', 'yaml', 'yml',
        'toml', 'ini', 'conf', 'cfg', 'env', 'properties', 'sh', 'bash', 'zsh', 'fish', 'ps1',
        'bat', 'cmd', 'go', 'py', 'pyw', 'js', 'mjs', 'cjs', 'ts', 'jsx', 'tsx', 'css', 'scss',
        'less', 'html', 'htm', 'vue', 'svelte', 'sql', 'rs', 'c', 'h', 'cc', 'cpp', 'hpp',
        'java', 'kt', 'kts', 'swift', 'rb', 'php', 'pl', 'lua', 'r', 'dart', 'gradle', 'tex',
        'hexlic', 'md5', 'sha1', 'sha256', 'sha512'
      ]);
      const textNames = new Set(['dockerfile', 'makefile', 'license', 'readme', 'changelog', 'hosts', 'history']);
      const previewTypes = new Set(['image', 'video', 'audio', 'pdf', 'text']);
      const sizePowers = { B: 0, KB: 1, MB: 2, GB: 3, TB: 4, PB: 5, EB: 6 };
      const nameCollator = new Intl.Collator('zh-CN', { numeric: true, sensitivity: 'base' });
      const maxTextPreviewBytes = 2 * 1024 * 1024;
      let files = [];
      let filesByUrl = new Map();
      let query = '';
      let sortKey = 'name';
      let sortDirection = 1;
      let previewController = null;

      const icon = (body, size = 21, strokeWidth = 1.8) =>
        `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${strokeWidth}">${body}</svg>`;
      const icons = {
        folder: icon('<path d="M3.5 7.5h6l2-2h9A1.5 1.5 0 0 1 22 7v10.5a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 1.5-2Z"/>'),
        image: icon('<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="9" r="1.5"/><path d="m4 17 5-5 3 3 2-2 6 5"/>'),
        video: icon('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m10 9 5 3-5 3V9Z"/>'),
        audio: icon('<path d="M9 18V6l10-2v12"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/>'),
        pdf: icon('<path d="M6 2.5h7l5 5V21H6V2.5Z"/><path d="M13 2.5v5h5M8.5 16h7M8.5 12h4"/>'),
        text: icon('<path d="M6 2.5h7l5 5V21H6V2.5Z"/><path d="M13 2.5v5h5M9 12h6M9 16h6"/>'),
        file: icon('<path d="M6 2.5h7l5 5V21H6V2.5Z"/><path d="M13 2.5v5h5"/>'),
        preview: icon('<path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/>', 16, 2),
        download: icon('<path d="M12 3v12m-5-5 5 5 5-5M5 21h14"/>', 16, 2)
      };

      function normalizePath(value) {
        const normalized = ('/' + value).replace(/\\/g, '/').replace(/\/{2,}/g, '/');
        return normalized.length > 1 ? normalized.replace(/\/$/, '') : normalized;
      }

      function decodeBase64Utf8(value) {
        const binary = atob((value || '').trim());
        const bytes = Uint8Array.from(binary, character => character.charCodeAt(0));
        return new TextDecoder('utf-8').decode(bytes);
      }

      function safeDecode(value) {
        try { return decodeURIComponent(value); } catch (_) { return value; }
      }

      function extension(name) {
        const dot = name.lastIndexOf('.');
        return dot > -1 ? name.slice(dot + 1).toLowerCase() : '';
      }

      function typeOf(file) {
        if (file.folder) return 'folder';
        const ext = extension(file.displayName);
        if (imageTypes.has(ext)) return 'image';
        if (videoTypes.has(ext)) return 'video';
        if (audioTypes.has(ext)) return 'audio';
        if (ext === 'pdf') return 'pdf';
        if (textTypes.has(ext) || textNames.has(file.displayName.toLowerCase())) return 'text';
        return 'file';
      }

      function addDownloadQuery(fileUrl) {
        return addFileQuery(fileUrl, 'download');
      }

      function addPreviewQuery(fileUrl) {
        return addFileQuery(fileUrl, 'preview');
      }

      function addFileQuery(fileUrl, name) {
        try {
          const target = new URL(fileUrl, window.location.href);
          target.searchParams.set(name, '1');
          return target.href;
        } catch (_) {
          return fileUrl + (fileUrl.includes('?') ? '&' : '?') + name + '=1';
        }
      }

      function escapeHTML(value) {
        const entities = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
        return String(value).replace(/[&<>"']/g, character => entities[character]);
      }

      function parseDate(value) {
        const timestamp = Date.parse(String(value).replace(/-/g, '/'));
        return Number.isFinite(timestamp) ? timestamp : 0;
      }

      function parseSize(value) {
        const match = String(value || '').match(/^([\d.]+)\s*(B|KB|MB|GB|TB|PB|EB)?$/i);
        if (!match) return 0;
        return Number(match[1]) * Math.pow(1024, sizePowers[(match[2] || 'B').toUpperCase()]);
      }

      function renderBreadcrumbs() {
        const relative = currentPath === '/' ? [] : currentPath.split('/').filter(Boolean);
        const rootSegments = rootPath.split('/').filter(Boolean);
        const nodes = [{ label: '根目录', href: rootPath || '/', root: true }];
        relative.forEach((segment, index) => {
          const href = normalizePath('/' + [...rootSegments, ...relative.slice(0, index + 1)].map(encodeURIComponent).join('/'));
          nodes.push({ label: safeDecode(segment), href });
        });
        breadcrumbs.replaceChildren();
        nodes.forEach((node, index) => {
          if (index) {
            const separator = document.createElement('span');
            separator.className = 'crumb-separator';
            separator.textContent = '›';
            breadcrumbs.appendChild(separator);
          }
          const link = document.createElement('a');
          link.className = node.root ? 'crumb home-link' : 'crumb' + (index === nodes.length - 1 ? ' current' : '');
          link.href = node.href;
          if (node.root) {
            link.setAttribute('aria-label', '返回根目录');
            link.title = '返回根目录';
            link.innerHTML = icons.folder;
          } else {
            link.textContent = node.label;
          }
          breadcrumbs.appendChild(link);
        });
        requestAnimationFrame(() => { breadcrumbs.scrollLeft = breadcrumbs.scrollWidth; });
      }

      function rowTemplate(file) {
        const type = file.type;
        const name = escapeHTML(file.displayName);
        const href = escapeHTML(file.url);
        let actions = '';
        if (file.previewable) {
          actions += `<button class="action-button" type="button" data-action="preview" title="预览" aria-label="预览 ${name}">${icons.preview}</button>`;
        }
        if (!file.folder) {
          actions += `<a class="action-button" href="${escapeHTML(addDownloadQuery(file.url))}" download title="下载" aria-label="下载 ${name}">${icons.download}</a>`;
        }
        return `
          <article class="file-row" data-url="${href}" tabindex="0">
            <div class="file-name-cell">
              <span class="file-icon ${type}" aria-hidden="true">${icons[type]}</span>
              <a class="file-link" href="${href}" data-primary="true">${name}</a>
            </div>
            <div class="meta date">${escapeHTML(file.date || '—')}</div>
            <div class="meta size">${escapeHTML(file.folder ? '文件夹' : (file.size || '—'))}</div>
            <div class="actions">${actions}</div>
          </article>`;
      }

      function visibleFiles() {
        const filtered = files.filter(file => file.searchName.includes(query));
        return filtered.sort((left, right) => {
          if (left.folder !== right.folder) return left.folder ? -1 : 1;
          let result = 0;
          if (sortKey === 'date') result = left.dateValue - right.dateValue;
          else if (sortKey === 'size') result = left.sizeValue - right.sizeValue;
          else result = nameCollator.compare(left.displayName, right.displayName);
          return result * sortDirection;
        });
      }

      function render() {
        const visible = visibleFiles();
        listElement.innerHTML = visible.map(rowTemplate).join('');
        emptyState.classList.toggle('visible', visible.length === 0);
        emptyTitle.textContent = query ? '没有匹配的文件' : '当前目录为空';
        emptyText.textContent = query ? '尝试使用其他关键词' : '这里暂时没有可显示的文件';
      }

      async function loadTextPreview(file, signal) {
        const response = await fetch(addPreviewQuery(file.url), { signal, credentials: 'same-origin' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const declaredSize = Number(response.headers.get('Content-Length') || 0);
        if (declaredSize > maxTextPreviewBytes) throw new Error('too-large');

        if (!response.body || !response.body.getReader) {
          const text = await response.text();
          if (new Blob([text]).size > maxTextPreviewBytes) throw new Error('too-large');
          return text;
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let received = 0;
        let result = '';
        while (true) {
          const chunk = await reader.read();
          if (chunk.done) break;
          received += chunk.value.byteLength;
          if (received > maxTextPreviewBytes) {
            await reader.cancel();
            throw new Error('too-large');
          }
          result += decoder.decode(chunk.value, { stream: true });
        }
        return result + decoder.decode();
      }

      function openPreview(file) {
        const type = file.type;
        if (!file.previewable) return;
        if (previewController) previewController.abort();
        previewController = type === 'text' ? new AbortController() : null;
        previewTitle.textContent = file.displayName;
        modalDownload.href = addDownloadQuery(file.url);
        modalDownload.setAttribute('download', file.displayName);
        previewStage.replaceChildren();
        previewStage.className = 'preview-stage' + (['text', 'audio', 'pdf'].includes(type) ? ` ${type}-mode` : '');
        modal.classList.add('open');
        document.body.style.overflow = 'hidden';
        modalClose.focus();
        if (type === 'image') {
          const image = new Image();
          image.alt = file.displayName;
          image.decoding = 'async';
          image.src = addPreviewQuery(file.url);
          image.addEventListener('error', () => showPreviewError('图片加载失败，仍可使用右上角按钮下载。'));
          previewStage.appendChild(image);
        } else if (type === 'video' || type === 'audio') {
          const media = document.createElement(type);
          if (type === 'video') media.playsInline = true;
          else media.className = 'audio-preview';
          media.controls = true;
          media.autoplay = true;
          media.preload = 'metadata';
          media.src = addPreviewQuery(file.url);
          media.addEventListener('error', () => showPreviewError(
            `浏览器不支持此${type === 'video' ? '视频' : '音频'}格式，可使用右上角按钮下载。`
          ));
          previewStage.appendChild(media);
        } else if (type === 'pdf') {
          const frame = document.createElement('iframe');
          frame.className = 'pdf-preview';
          frame.title = file.displayName;
          frame.src = addPreviewQuery(file.url);
          previewStage.appendChild(frame);
        } else {
          const loading = document.createElement('div');
          loading.className = 'preview-message';
          loading.textContent = '正在读取文本…';
          previewStage.appendChild(loading);
          const controller = previewController;
          loadTextPreview(file, controller.signal).then(text => {
            if (controller.signal.aborted) return;
            const content = document.createElement('pre');
            content.className = 'text-preview';
            content.textContent = text;
            previewStage.replaceChildren(content);
          }).catch(error => {
            if (error.name === 'AbortError') return;
            const message = error.message === 'too-large'
              ? '文件超过 2 MiB，为避免占用过多内存，请下载后查看。'
              : '文本读取失败，仍可使用右上角按钮下载。';
            showPreviewError(message);
          });
        }
      }

      function showPreviewError(message) {
        previewStage.replaceChildren();
        const element = document.createElement('div');
        element.className = 'preview-message';
        element.textContent = message;
        previewStage.appendChild(element);
      }

      function closePreview() {
        if (previewController) {
          previewController.abort();
          previewController = null;
        }
        const media = previewStage.querySelector('video, audio');
        if (media) {
          media.pause();
          media.removeAttribute('src');
          media.load();
        }
        modal.classList.remove('open');
        previewStage.className = 'preview-stage';
        previewStage.replaceChildren();
        document.body.style.overflow = '';
      }

      listElement.addEventListener('click', event => {
        const row = event.target.closest('.file-row');
        if (!row) return;
        const file = filesByUrl.get(row.dataset.url);
        if (!file) return;
        if (event.target.closest('a[download]')) return;
        const previewButton = event.target.closest('[data-action="preview"]');
        const primaryLink = event.target.closest('[data-primary]');
        if (file.previewable && (previewButton || primaryLink || !event.target.closest('a, button'))) {
          event.preventDefault();
          openPreview(file);
        }
      });

      listElement.addEventListener('keydown', event => {
        if (event.key !== 'Enter' && event.key !== ' ') return;
        if (event.target.closest('a, button')) return;
        const row = event.target.closest('.file-row');
        const file = row && filesByUrl.get(row.dataset.url);
        if (!file) return;
        event.preventDefault();
        if (file.folder) window.location.href = file.url;
        else if (file.previewable) openPreview(file);
        else window.location.href = addDownloadQuery(file.url);
      });

      searchInput.addEventListener('input', () => {
        query = searchInput.value.trim().toLocaleLowerCase('zh-CN');
        searchClear.classList.toggle('visible', Boolean(query));
        render();
      });

      searchClear.addEventListener('click', () => {
        searchInput.value = '';
        searchInput.dispatchEvent(new Event('input'));
        searchInput.focus();
      });

      sortButtons.forEach(button => {
        button.addEventListener('click', () => {
          const nextKey = button.dataset.sort;
          sortDirection = sortKey === nextKey ? -sortDirection : 1;
          sortKey = nextKey;
          sortButtons.forEach(item => item.classList.toggle('active', item === button));
          render();
        });
      });

      modalClose.addEventListener('click', closePreview);
      modal.addEventListener('click', event => { if (event.target === modal) closePreview(); });
      document.addEventListener('keydown', event => {
        if (event.key === 'Escape' && modal.classList.contains('open')) closePreview();
        if (event.key === '/' && !modal.classList.contains('open') && document.activeElement !== searchInput) {
          event.preventDefault();
          searchInput.focus();
        }
      });

      if (matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.dataset.theme = 'dark';
      }

      try {
        const parsed = JSON.parse(decodeBase64Utf8(app.dataset.files));
        files = (Array.isArray(parsed) ? parsed : []).map(file => {
          const displayName = safeDecode(file.name || '');
          const normalized = {
            ...file,
            displayName,
            searchName: displayName.toLocaleLowerCase('zh-CN'),
            dateValue: parseDate(file.date),
            sizeValue: parseSize(file.size)
          };
          normalized.type = typeOf(normalized);
          normalized.previewable = previewTypes.has(normalized.type);
          return normalized;
        });
        filesByUrl = new Map(files.map(file => [file.url, file]));
        renderBreadcrumbs();
        render();
      } catch (error) {
        console.error(error);
        emptyState.classList.add('visible');
        emptyTitle.textContent = '无法显示文件列表';
        emptyText.textContent = '页面数据格式无效，请刷新后重试';
      }
    })();
  </script>
</body>
</html>
